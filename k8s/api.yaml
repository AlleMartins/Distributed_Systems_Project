apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: api:latest
        imagePullPolicy: Never # Fondamentale: impedisce a K8s di cercare l'immagine su internet
        env:
        - name: MONGO_URL
          value: "mongodb://mongo-0.mongo:27017,mongo-1.mongo:27017,mongo-2.mongo:27017/app?replicaSet=rs0"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: CORS_ORIGIN
          value: "http://board.local"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "500m"
        # Probes per l'Alta Affidabilità (HA)
        # - livenessProbe: shallow, verifica solo che Express risponda.
        #   Se fallisse su un check "profondo", un disservizio temporaneo
        #   di Mongo/Redis causerebbe riavvii inutili del pod.
        # - readinessProbe: deep, verifica anche Mongo e Redis. Se le
        #   dipendenze non rispondono, il pod esce dal Service (niente
        #   traffico) senza essere riavviato, e rientra da solo appena
        #   le dipendenze tornano disponibili.
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: app
spec:
  selector:
    app: api
  ports:
  - port: 3000
    targetPort: 3000
---
# Stesso scopo del mongo-pdb, ma con una soglia RELATIVA invece che
# assoluta: le repliche API non sono un numero fisso, l'HPA le scala da 3
# a 10. `minAvailable: 2` sarebbe troppo lasco a 10 repliche (un drain
# potrebbe portarne via 8 insieme) e inutilmente stretto se l'HPA
# scendesse; `maxUnavailable: 1` si adatta da solo al numero corrente.
# Vale solo per le disruption volontarie: i rolling update restano
# governati dalla strategy del Deployment.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: app
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: api
