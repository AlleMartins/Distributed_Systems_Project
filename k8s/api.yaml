apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: api:latest
        imagePullPolicy: Never # Fondamentale: impedisce a K8s di cercare l'immagine su internet
        env:
        - name: MONGO_URL
          value: "mongodb://mongo:27017/app?replicaSet=rs0"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: CORS_ORIGIN
          value: "http://board.local"
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "500m"
        # Aggiunta Probes per l'Alta Affidabilità (HA)
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: app
spec:
  selector:
    app: api
  ports:
  - port: 3000
    targetPort: 3000