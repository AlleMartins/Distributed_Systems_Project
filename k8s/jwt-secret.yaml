# =========================================================================
# jwt-secret.yaml - Secret condiviso per la firma/verifica dei JWT
#
# Tutte e 3 le repliche del Deployment `api` montano lo STESSO secret:
# è ciò che rende l'autenticazione stateless in un cluster orizzontalmente
# scalato. Un token emesso dal pod api-0 può essere verificato dal pod
# api-1 o api-2 senza bisogno di session affinity o storage condiviso
# aggiuntivo (a differenza di, es., sessioni in memoria).
#
# ATTENZIONE: il valore qui sotto è un placeholder generato per l'ambiente
# di sviluppo/demo (Minikube locale). In un deployment reale NON va mai
# committato in chiaro nel repository: va creato a parte, ad esempio con
#   kubectl create secret generic jwt-secret \
#     --namespace app \
#     --from-literal=JWT_SECRET=$(openssl rand -base64 48)
# oppure gestito con un secret manager esterno (Sealed Secrets, Vault,
# External Secrets Operator, ecc.).
# =========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: app
type: Opaque
stringData:
  JWT_SECRET: "okg5RWNsilUpPGUuuL5c7DXIRhtxDqFyrzdst9opvPvnFR88U2IUiVYlfdDH6DQo"
